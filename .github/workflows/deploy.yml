name: Despliegue en GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar lint
        run: npm run lint

      - name: Ejecutar pruebas
        run: npm test -- --no-watch

      - name: Compilar la aplicación
        run: npm run build -- --base-href /${{ github.event.repository.name }}/

      - name: Preparar carpeta de salida para GitHub Pages
        run: cp dist/physical-exercises/browser/index.html dist/physical-exercises/browser/404.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/physical-exercises/browser

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
