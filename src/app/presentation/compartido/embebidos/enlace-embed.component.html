<div class="enlace-embed" [class.enlace-embed--con-vista-previa]="urlPrevia()">
  <span class="enlace-embed__titulo">{{ titulo() }}</span>
  @if (urlPrevia(); as url) {
    <iframe
      class="enlace-embed__vista-previa"
      [class.enlace-embed__vista-previa--tiktok]="plataformaEmbed() === 'TikTok'"
      [src]="url"
      [title]="'Vista previa de ' + plataformaEmbed()"
      loading="lazy"
      allow="encrypted-media; fullscreen; picture-in-picture"
      allowfullscreen
    ></iframe>
  }
  <a class="enlace-embed__fallback" mat-stroked-button [href]="url()" target="_blank" rel="noopener noreferrer">
    <mat-icon>open_in_new</mat-icon>
    Abrir enlace externo
  </a>
</div>
