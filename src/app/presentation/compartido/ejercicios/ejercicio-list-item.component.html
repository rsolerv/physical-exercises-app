<a
  mat-list-item
  class="busqueda-ejercicios__tarjeta"
  [routerLink]="['/ejercicios', ejercicio().id]"
  [state]="{ returnUrl: '/buscar' }"
>
  <span matListItemTitle>{{ ejercicio().nombre }}</span>
  <span matListItemLine class="busqueda-ejercicios__descripcion">{{ ejercicio().descripcion }}</span>
  <span matListItemLine class="busqueda-ejercicios__etiquetas">
    @for (nombre of nombresCategorias(); track nombre) {
      {{ nombresCategorias().join(', ') }}
    }
  </span>
</a>
